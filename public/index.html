<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="/auth-guard.js"></script>
  <title>Promo Manager</title>

  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f5f7fb;
      --card: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
    }

    * {
      box-sizing: border-box;
      min-width: 0;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 40px;
      color: var(--text);
    }

    h2 { margin-top: 0; }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    }

    label { font-weight: 600; }

    select, input[type="file"] {
      margin-top: 6px;
      padding: 8px;
      width: 260px;
    }

    button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover { opacity: 0.9; }
    button.secondary { background: #9ca3af; }

    video {
      width: 100%;
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      margin-top: 6px;
      display: block;
    }

    progress {
      width: 100%;
      max-width: 520px;
      height: 10px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #platforms label {
      display: inline-flex;
      align-items: center;
      margin-right: 16px;
      margin-top: 8px;
      font-weight: 500;
      gap: 6px;
    }

    .platform-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
      margin-top: 20px;
      align-items: stretch;
    }

    @media (max-width: 1100px) {
      .platform-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      .platform-grid {
        grid-template-columns: 1fr;
      }
    }

    .platform-column {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .platform-column h3 {
      margin-top: 0;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    .promo-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .promo-card strong {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      word-break: break-all;
    }

    .promo-card button {
      margin-top: 8px;
      background: #ef4444;
    }

    .status {
      margin-top: 8px;
      color: var(--muted);
    }

    /* Added Multi-Select Styles */
    .multi-select {
      position: relative;
      display: inline-block;
    }

    .dropdown-panel {
      display: none;
      position: absolute;
      top: 42px;
      left: 0;
      width: 350px;
      max-height: 300px;
      overflow-y: auto;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px;
      z-index: 999;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .dropdown-panel label {
      display: block;
      margin-bottom: 8px;
      font-weight: normal;
    }

    .dropdown-panel input {
      margin-right: 8px;
    }

    /* Style for the selected channels display */
    #selectedChannelsList {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .channel-tag {
      background-color: #e0e7ff;
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
    }

    /* Per-channel platform selection */
    .pf-panel { margin-top: 18px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .pf-panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; background: #f9fafb; border-bottom: 1px solid var(--border); }
    .pf-panel-head .title { font-weight: 700; }
    .pf-quick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
    .pf-quick button { background: #fff; color: var(--text); border: 1.5px solid var(--border); padding: 4px 10px; font-weight: 600; font-size: 12.5px; }
    .pf-quick button.on { border-color: var(--primary); color: var(--primary); background: #eef2ff; }
    .pf-row { display: grid; grid-template-columns: 240px 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--border); }
    .pf-row:first-of-type { border-top: none; }
    .pf-row .ch { font-weight: 600; word-break: break-word; }
    .pf-row .ch small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
    .pf-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .pf-chip { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--border); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 500; cursor: pointer; user-select: none; background: #fff; }
    .pf-chip input { margin: 0; }
    .pf-chip.on { border-color: var(--primary); background: #eef2ff; color: #3730a3; }
    .pf-row .row-actions button { background: transparent; color: var(--primary); padding: 4px 6px; font-size: 12.5px; }
    .pf-warn { color: #92400e; font-size: 13px; }
    .pf-summary { padding: 10px 14px; background: #f9fafb; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); }
    .pf-summary b { color: var(--text); }
    .result-list { margin-top: 10px; font-size: 13px; }
    .result-list .ok { color: #047857; }
    .result-list .fail { color: #b91c1c; }
    @media (max-width: 800px) { .pf-row { grid-template-columns: 1fr; } }

    /* Style for multi-channel headers */
    .channel-section-header {
      border-bottom: 2px solid var(--border);
      padding-bottom: 10px;
      color: var(--primary);
      margin-top: 30px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div class="container">

<div style="display:flex; justify-content:flex-end; margin-bottom:16px; position:relative;">
  <button onclick="toggleUserMenu()" style="background:#111827;">
    👤 User ▾
  </button>

  <div id="userMenu" style="
      display:none;
      position:absolute;
      top:40px;
      right:0;
      background:white;
      border:1px solid #e5e7eb;
      border-radius:10px;
      box-shadow:0 10px 25px rgba(0,0,0,0.08);
      padding:10px;
      min-width:160px;
      z-index:100;
  ">
<div style="display:flex; flex-direction:column; gap:8px;">
  <div id="adminOption" style="display:none;">
    <button onclick="goToAdmin()" style="width:100%;">⚙️ Admin Panel</button>
  </div>

  <button onclick="goToTraffic()" style="width:100%;">
    📊 Traffic Dashboard
  </button>

  <button onclick="goToRca()" style="width:100%;">
    🔎 Impression RCA
  </button>

  <button onclick="window.location.href='/render-rate-rca.html'" style="width:100%; white-space: nowrap;">
    📉 Render Rate RCA
  </button>

  <button onclick="logout()" style="width:100%; background:#ef4444;">
    🚪 Logout
  </button>
</div>
  </div>
</div>

  <div class="card">
    <h2>📤 Upload Promo</h2>

    <label>Channels</label><br>

    <div class="multi-select">
      <button
        type="button"
        id="channelDropdownBtn"
        class="secondary"
        onclick="toggleChannelDropdown()"
      >
        Select Channels ▼
      </button>

      <div id="channelDropdown" class="dropdown-panel"></div>
    </div>

    <!-- Container for selected channels -->
    <div id="selectedChannelsList"></div>

    <!-- Per-channel platform selection (filled from each channel's admin config) -->
    <div id="platforms"></div>

    <br>
    <input type="file" id="fileInput" accept="video/mp4" multiple><br><br>

    <button id="uploadBtn" onclick="uploadPromo()">Upload</button>
    <button class="secondary" onclick="cancelUpload()">Cancel</button>

    <br><br>
    <progress id="progressBar" max="100" value="0"></progress>
    <div id="status" class="status"></div>
    <div id="uploadResults" class="result-list"></div>
  </div>

  <div class="card">
    <h2>📃 Existing Promos</h2>
    <button onclick="loadPromos()">Load Promos</button>
    <div id="promoList"></div>
  </div>

</div>

<script>

function goToAdmin() {
  window.location.href = "/admin.html";
}
function goToTraffic() {
  window.location.href = "/traffic.html";
}
function goToRca() {
  window.location.href = "/rca.html";
}

/* 🔐 AUTH CHECK handled by auth-guard.js loaded in <head> */

/* 🔐 AUTH FETCH (GLOBAL) — uses the shared authGuard helper */
function authFetch(url, options = {}) {
  options.headers = {
    ...(options.headers || {}),
    ...window.authGuard.authHeaders(),
  };
  return fetch(url, options);
}

function logout() { window.authGuard.logout(); }

function toggleUserMenu() {
  const menu = document.getElementById("userMenu");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
}

// Close dropdowns when clicking outside
document.addEventListener("click", function(e) {
  // User Profile Dropdown logic
  const menu = document.getElementById("userMenu");
  if (!e.target.closest("#userMenu") && !e.target.closest("button")) {
    menu.style.display = "none";
  }

  // Channels Dropdown logic
  const dropdown = document.querySelector(".multi-select");
  if (dropdown && !dropdown.contains(e.target)) {
    document.getElementById("channelDropdown").style.display = "none";
  }
});

// Show admin option only for admin role
if (localStorage.getItem("role") === "admin") {
  document.getElementById("adminOption").style.display = "block";
}

let currentXHR = null;

const channelDropdown = document.getElementById("channelDropdown");
const channelDropdownBtn = document.getElementById("channelDropdownBtn");
const platformsBox = document.getElementById("platforms");
const promoList = document.getElementById("promoList");
const statusEl = document.getElementById("status");
const progressBar = document.getElementById("progressBar");
const fileInput = document.getElementById("fileInput");

/* ---------- Channel Helper Functions ---------- */
function toggleChannelDropdown() {
  const dropdown = document.getElementById("channelDropdown");
  dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
}

function getSelectedChannels() {
  return [
    ...document.querySelectorAll("#channelDropdown input:checked")
  ].map(cb => cb.value);
}

function updateChannelButtonText() {
  const selected = getSelectedChannels();
  const listContainer = document.getElementById("selectedChannelsList");

  if (!selected.length) {
    channelDropdownBtn.textContent = "Select Channels ▼";
    listContainer.innerHTML = ""; // Clear the list if nothing is selected
    return;
  }

  channelDropdownBtn.textContent = `${selected.length} Channel(s) Selected ▼`;
  
  // Render the selected channels as HTML tags
  listContainer.innerHTML = selected
    .map(channel => `<span class="channel-tag">${channel}</span>`)
    .join('');
}

function escapeHtml(v) {
  return String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* ---------- Load channels ---------- */
async function loadChannels() {
  const res = await authFetch("/channels");
  if (res.status === 401) { logout(); return; }
  const channels = await res.json();

  channelDropdown.innerHTML = "";

  channels.forEach(channelName => {
    const label = document.createElement("label");
    label.innerHTML = `<input type="checkbox" value="${escapeHtml(channelName)}"> ${escapeHtml(channelName)}`;
    label.querySelector("input").addEventListener("change", () => {
      updateChannelButtonText();
      loadPlatforms();
    });
    channelDropdown.appendChild(label);
  });

  updateChannelButtonText();
}

/* ---------- Platforms per channel ----------
   Platforms come from each channel's configuration in the admin panel.
   Each selected channel has its own platform selection.
-------------------------------------------- */
const platformsByChannel = new Map();   // channel -> [platform names] (cache)
const platformSelection = new Map();    // channel -> Set(selected platform names)
let platformLoadSeq = 0;

async function loadPlatforms() {
  const selectedChannels = getSelectedChannels();

  // forget selections for channels that were unticked
  for (const ch of [...platformSelection.keys()]) {
    if (!selectedChannels.includes(ch)) platformSelection.delete(ch);
  }

  if (!selectedChannels.length) {
    platformsBox.innerHTML = "";
    return;
  }

  const missing = selectedChannels.filter(ch => !platformsByChannel.has(ch));
  if (missing.length) {
    const seq = ++platformLoadSeq;
    platformsBox.innerHTML = `<div class="status">Loading platforms…</div>`;
    try {
      const res = await authFetch("/channels/platforms", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ channels: missing })
      });
      if (res.status === 401) { logout(); return; }
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to load platforms");
      if (seq !== platformLoadSeq) return;            // a newer load is in flight

      for (const [ch, list] of Object.entries(data.platforms || {})) platformsByChannel.set(ch, list);
      for (const ch of [...(data.notFound || []), ...(data.forbidden || [])]) platformsByChannel.set(ch, []);
    } catch (err) {
      console.error(err);
      platformsBox.innerHTML = `<div class="status">❌ ${escapeHtml(err.message)}</div>`;
      return;
    }
  }

  // newly selected channel: all its platforms ticked by default
  for (const ch of selectedChannels) {
    if (!platformSelection.has(ch)) platformSelection.set(ch, new Set(platformsByChannel.get(ch) || []));
  }

  renderPlatformPanel();
}

function renderPlatformPanel() {
  const channels = getSelectedChannels();
  if (!channels.length) { platformsBox.innerHTML = ""; return; }

  // every platform name available across the selected channels
  const allPlatforms = [...new Set(channels.flatMap(ch => platformsByChannel.get(ch) || []))];

  const quick = allPlatforms.map(p => {
    const having = channels.filter(ch => (platformsByChannel.get(ch) || []).includes(p));
    const allOn = having.every(ch => platformSelection.get(ch)?.has(p));
    return `<button type="button" class="${allOn ? "on" : ""}" data-platform="${escapeHtml(p)}"
              title="${allOn ? "Untick" : "Tick"} ${escapeHtml(p)} on ${having.length} channel(s)">
              ${allOn ? "✓ " : ""}${escapeHtml(p)} <span style="color:var(--muted)">${having.length}</span>
            </button>`;
  }).join("");

  const rows = channels.map(ch => {
    const available = platformsByChannel.get(ch) || [];
    const sel = platformSelection.get(ch) || new Set();
    const body = available.length
      ? `<div class="pf-chips">${available.map(p => `
          <label class="pf-chip ${sel.has(p) ? "on" : ""}">
            <input type="checkbox" data-channel="${escapeHtml(ch)}" data-platform="${escapeHtml(p)}" ${sel.has(p) ? "checked" : ""}>
            ${escapeHtml(p)}
          </label>`).join("")}</div>`
      : `<div class="pf-warn">⚠️ No platforms configured for this channel. ${
          localStorage.getItem("role") === "admin" ? `<a href="/admin.html">Add them in the Admin Panel</a>.` : "Ask an admin to add them."}</div>`;

    return `
      <div class="pf-row">
        <div class="ch">${escapeHtml(ch)}<small>${available.length} platform${available.length === 1 ? "" : "s"} available</small></div>
        ${body}
        <div class="row-actions">${available.length ? `
          <button type="button" data-all="${escapeHtml(ch)}">All</button>
          <button type="button" data-none="${escapeHtml(ch)}">None</button>` : ""}
        </div>
      </div>`;
  }).join("");

  const targets = getTargets();
  const totalTargets = targets.reduce((n, t) => n + t.platforms.length, 0);

  platformsBox.innerHTML = `
    <div class="pf-panel">
      <div class="pf-panel-head">
        <span class="title">Platforms per channel</span>
        ${allPlatforms.length > 0 && channels.length > 1 ? `<div class="pf-quick">Apply to all channels: ${quick}</div>` : ""}
      </div>
      ${rows}
      <div class="pf-summary">
        ${totalTargets
          ? `Each file will be added to <b>${totalTargets}</b> deliver${totalTargets === 1 ? "y" : "ies"} across <b>${targets.length}</b> channel${targets.length === 1 ? "" : "s"}.`
          : "No platforms selected yet."}
      </div>
    </div>`;

  // events
  platformsBox.querySelectorAll(".pf-chip input").forEach(cb => cb.addEventListener("change", () => {
    const set = platformSelection.get(cb.dataset.channel);
    cb.checked ? set.add(cb.dataset.platform) : set.delete(cb.dataset.platform);
    renderPlatformPanel();
  }));
  platformsBox.querySelectorAll("[data-all]").forEach(b => b.addEventListener("click", () => {
    platformSelection.set(b.dataset.all, new Set(platformsByChannel.get(b.dataset.all) || []));
    renderPlatformPanel();
  }));
  platformsBox.querySelectorAll("[data-none]").forEach(b => b.addEventListener("click", () => {
    platformSelection.set(b.dataset.none, new Set());
    renderPlatformPanel();
  }));
  platformsBox.querySelectorAll(".pf-quick button").forEach(b => b.addEventListener("click", () => {
    const p = b.dataset.platform;
    const having = getSelectedChannels().filter(ch => (platformsByChannel.get(ch) || []).includes(p));
    const allOn = having.every(ch => platformSelection.get(ch)?.has(p));
    having.forEach(ch => allOn ? platformSelection.get(ch).delete(p) : platformSelection.get(ch).add(p));
    renderPlatformPanel();
  }));
}

/** [{ channel, platforms: [...] }] for channels with at least one platform ticked */
function getTargets() {
  return getSelectedChannels()
    .map(ch => ({ channel: ch, platforms: [...(platformSelection.get(ch) || [])] }))
    .filter(t => t.platforms.length);
}

function getSelectedPlatformsFor(channel) {
  return [...(platformSelection.get(channel) || [])];
}

/* ---------- MULTI Upload ----------
   All files go in ONE request. The bar covers the three stages:
     sending to server (browser progress)  0–45%
     server → S3 (streamed from server)   45–90%
     StormForge updates (streamed)        90–100%
------------------------------------- */
const STAGE = { send: [0, 45], s3: [45, 90], sf: [90, 100] };
let uploadStage = null;

function fmtBytes(n) {
  if (!n) return "0 MB";
  return n >= 1e9 ? `${(n / 1e9).toFixed(2)} GB` : `${(n / 1e6).toFixed(1)} MB`;
}
function fmtSecs(ms) { return `${(ms / 1000).toFixed(1)}s`; }

function setProgress(stage, fraction, text) {
  const [a, b] = STAGE[stage];
  const f = Math.max(0, Math.min(1, fraction || 0));
  // never move backwards
  progressBar.value = Math.max(progressBar.value, a + (b - a) * f);
  if (text) statusEl.textContent = text;
}

function sendBatch(files, targets, onEvent) {
  return new Promise((resolve) => {
    const fd = new FormData();
    for (const f of files) fd.append("files", f);
    fd.append("targets", JSON.stringify(targets));

    const totalBytes = [...files].reduce((n, f) => n + f.size, 0);
    const xhr = new XMLHttpRequest();
    currentXHR = xhr;
    let parsed = 0;
    let final = null;

    xhr.open("POST", "/upload?stream=1");
    xhr.setRequestHeader("Authorization", "Bearer " + localStorage.getItem("token"));

    xhr.upload.onprogress = (e) => {
      if (!e.lengthComputable) return;
      uploadStage = "send";
      setProgress("send", e.loaded / e.total,
        `Sending to server… ${Math.round((e.loaded / e.total) * 100)}% (${fmtBytes(e.loaded)} of ${fmtBytes(totalBytes)})`);
    };
    xhr.upload.onload = () => {
      setProgress("send", 1, "Files received by server, preparing…");
    };

    // Server streams one JSON object per line while it works
    xhr.onprogress = () => {
      const text = xhr.responseText;
      let nl;
      while ((nl = text.indexOf("\n", parsed)) !== -1) {
        const line = text.slice(parsed, nl).trim();
        parsed = nl + 1;
        if (!line) continue;
        try {
          const ev = JSON.parse(line);
          if (ev.type === "done" || ev.type === "error") final = ev;
          onEvent(ev);
        } catch { /* partial line, wait for more */ }
      }
    };

    xhr.onload = () => {
      xhr.onprogress();                       // flush any remaining lines
      if (xhr.status === 401) {
        alert("Session expired. Login again.");
        logout();
        return resolve({ aborted: true });
      }
      if (final) return resolve(final.type === "done" ? final : { status: 500, error: final.error });
      // non-stream error response (validation, 403, …)
      let body = {};
      try { body = JSON.parse(xhr.responseText); } catch { /* not JSON */ }
      resolve({ status: xhr.status, ...body });
    };
    xhr.onerror = () => resolve({ status: 0, error: "Network error — the connection to the server was lost" });
    xhr.onabort = () => resolve({ aborted: true });

    xhr.send(fd);
  });
}

async function uploadPromo() {
  const files = fileInput.files;
  const targets = getTargets();

  if (!getSelectedChannels().length) return alert("Select at least one channel");
  if (!targets.length) return alert("Select at least one platform for at least one channel");
  if (!files.length) return alert("Choose a file to upload");

  const skipped = getSelectedChannels().filter(ch => !targets.some(t => t.channel === ch));
  if (skipped.length && !confirm(`No platforms selected for: ${skipped.join(", ")}.\n\nThese channels will be skipped. Continue?`)) return;

  const resultBox = document.getElementById("uploadResults");
  resultBox.innerHTML = "";
  progressBar.value = 0;
  const started = Date.now();
  const uploadBtn = document.getElementById("uploadBtn");
  uploadBtn.disabled = true;

  const r = await sendBatch(files, targets, (ev) => {
    if (ev.type === "start") {
      uploadStage = "s3";
      setProgress("s3", 0, `Uploading ${ev.files.length} file(s) to S3…`);
    } else if (ev.type === "s3") {
      uploadStage = "s3";
      setProgress("s3", ev.total ? ev.loaded / ev.total : 0,
        `Uploading to S3… ${ev.filesDone}/${ev.filesTotal} files done (${fmtBytes(ev.loaded)} of ${fmtBytes(ev.total)})`);
    } else if (ev.type === "delivery") {
      uploadStage = "sf";
      setProgress("sf", ev.done / ev.total,
        `Updating StormForge… ${ev.done}/${ev.total} deliveries${ev.ok ? "" : ` (${ev.channel} / ${ev.platform} failed)`}`);
    }
  });

  currentXHR = null;
  uploadBtn.disabled = false;

  if (r.aborted) {
    statusEl.textContent = uploadStage === "sf"
      ? "⚠️ Cancelled while StormForge was being updated — some deliveries may already have the new promos. Reload promos to check."
      : "❌ Upload cancelled";
    progressBar.value = 0;
    return;
  }

  const lines = [];
  for (const f of r.files || []) {
    lines.push(f.ok
      ? `<div class="ok">✅ ${escapeHtml(f.name)} → ${f.deliveriesUpdated} deliver${f.deliveriesUpdated === 1 ? "y" : "ies"} updated</div>`
      : `<div class="fail">❌ ${escapeHtml(f.name)}: ${escapeHtml(f.error)}</div>`);
  }
  if (!r.files) lines.push(`<div class="fail">❌ ${escapeHtml(r.error || `Upload failed (HTTP ${r.status})`)}</div>`);
  for (const f of (r.failures || []).filter(x => !x.file)) {
    lines.push(`<div class="fail" style="margin-left:18px;">• ${escapeHtml(f.channel)} / ${escapeHtml(f.platform)}: ${escapeHtml(f.reason)}</div>`);
  }
  resultBox.innerHTML = lines.join("");

  const t = r.timings;
  const timingText = t ? ` · S3 ${fmtSecs(t.s3Ms)}, StormForge ${fmtSecs(t.stormforgeMs)}` : "";
  const ok = r.files && r.success;
  progressBar.value = r.files ? 100 : 0;
  statusEl.textContent = (ok ? "✅ All uploads complete" : "⚠️ Finished with errors — see details below")
    + ` in ${fmtSecs(Date.now() - started)}${timingText}`;

  fileInput.value = "";
  if (r.deliveries?.length) loadPromos();
}

function cancelUpload() {
  if (!currentXHR) return;
  currentXHR.abort();   // result message is set by uploadPromo()
}

/* ---------- Load promos ---------- */
async function loadPromos() {
  promoList.innerHTML = "";

  const channels = getSelectedChannels();
  if (!channels.length) {
    promoList.innerHTML = "<p>Select at least one channel above</p>";
    return;
  }

  const targets = getTargets();
  if (!targets.length) {
    promoList.innerHTML = "<p>Select at least one platform above</p>";
    return;
  }

  for (const { channel, platforms } of targets) {
    const channelContainer = document.createElement("div");
    channelContainer.style.marginBottom = "40px";
    channelContainer.innerHTML = `<h2 class="channel-section-header">📡 Channel: ${escapeHtml(channel)}</h2>`;
    promoList.appendChild(channelContainer);

    const q = new URLSearchParams({ channelName: channel, platforms: JSON.stringify(platforms) });
    const res = await authFetch(`/promos?${q}`);

    if (res.status === 401) {
      alert("Session expired. Login again.");
      logout();
      return;
    }

    if (!res.ok) {
      channelContainer.innerHTML += `<p style="color:red;">❌ Failed to load promos for ${escapeHtml(channel)}</p>`;
      continue;
    }

    const data = await res.json();
    const grid = document.createElement("div");
    grid.className = "platform-grid";

    platforms.forEach(platform => {
      const urls = data[platform] || [];
      const column = document.createElement("div");
      column.className = "platform-column";
      column.dataset.channel = channel;
      column.dataset.platform = platform;

      column.innerHTML = `
        <h3>📺 ${escapeHtml(platform)}</h3>
        <div style="margin-bottom:15px;">
          <label><input type="checkbox" class="selectAll"> Select All</label>
          <button class="deleteSelected" style="margin-left:10px;background:#dc2626;">🗑 Delete Selected</button>
        </div>
        ${!urls.length ? "<p>No promos</p>" : `
          <div style="background:white;border:1px solid #e5e7eb;border-radius:10px;padding:10px;margin-bottom:14px;">
            <strong>Current Promo URLs</strong>
            <ul style="margin-top:8px;padding-left:18px;font-size:12px;word-break:break-all;">
              ${urls.map(url => `<li><a href="${escapeHtml(url)}" target="_blank">${escapeHtml(url)}</a></li>`).join("")}
            </ul>
          </div>
          ${urls.map(url => `
            <div class="promo-card">
              <label style="display:block;margin-bottom:8px;">
                <input class="promoCheckbox" type="checkbox" value="${escapeHtml(url)}"> Select
              </label>
              <strong>${escapeHtml(url.split("/").pop())}</strong>
              <video src="${escapeHtml(url)}" controls muted preload="metadata"></video>
              <button class="deleteOne" data-url="${escapeHtml(url)}">🗑 Delete</button>
            </div>`).join("")}`}
      `;

      column.querySelector(".selectAll").addEventListener("change", e => {
        column.querySelectorAll(".promoCheckbox").forEach(cb => cb.checked = e.target.checked);
      });
      column.querySelector(".deleteSelected").addEventListener("click", () => deleteSelectedPromos(column));
      column.querySelectorAll(".deleteOne").forEach(b =>
        b.addEventListener("click", () => deletePromo(channel, b.dataset.url)));

      grid.appendChild(column);
    });

    channelContainer.appendChild(grid);
  }
}

/* ---------- Delete promo ---------- */
async function deleteSelectedPromos(column) {
  const { channel, platform } = column.dataset;
  const urls = [...column.querySelectorAll(".promoCheckbox:checked")].map(cb => cb.value);

  if (!urls.length) return alert("Select at least one promo in this section");
  if (!confirm(`Delete ${urls.length} selected promo(s) for ${channel} on ${platform}?`)) return;

  const res = await authFetch("/promos", {
    method: "DELETE",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ channelName: channel, platforms: [platform], urls })
  });

  if (res.ok) loadPromos();
  else alert("Failed to delete promos");
}

// Single delete removes the file from every platform currently selected for this channel
async function deletePromo(channel, url) {
  const filename = url.split("/").pop();
  const platforms = getSelectedPlatformsFor(channel);

  const confirmed = confirm(
    `Delete this promo?\n\nChannel: ${channel}\nFile: ${filename}\nPlatforms: ${platforms.join(", ")}`
  );
  if (!confirmed) return;

  const res = await authFetch("/promos", {
    method: "DELETE",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ channelName: channel, platforms, url })
  });

  if (res.status === 401) {
    alert("Session expired. Login again.");
    logout();
    return;
  }
  if (!res.ok) alert("Failed to delete promo");

  loadPromos();
}

loadChannels();
</script>
