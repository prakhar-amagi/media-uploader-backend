<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="/auth-guard.js"></script>
  <title>Promo Manager</title>

  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f5f7fb;
      --card: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
    }

    * {
      box-sizing: border-box;
      min-width: 0;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 40px;
      color: var(--text);
    }

    h2 { margin-top: 0; }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    }

    label { font-weight: 600; }

    select, input[type="file"] {
      margin-top: 6px;
      padding: 8px;
      width: 260px;
    }

    button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover { opacity: 0.9; }
    button.secondary { background: #9ca3af; }

    video {
      width: 100%;
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      margin-top: 6px;
      display: block;
    }

    progress {
      width: 300px;
      height: 10px;
    }

    #platforms label {
      display: inline-flex;
      align-items: center;
      margin-right: 16px;
      margin-top: 8px;
      font-weight: 500;
      gap: 6px;
    }

    .platform-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
      margin-top: 20px;
      align-items: stretch;
    }

    @media (max-width: 1100px) {
      .platform-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      .platform-grid {
        grid-template-columns: 1fr;
      }
    }

    .platform-column {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .platform-column h3 {
      margin-top: 0;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    .promo-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .promo-card strong {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      word-break: break-all;
    }

    .promo-card button {
      margin-top: 8px;
      background: #ef4444;
    }

    .status {
      margin-top: 8px;
      color: var(--muted);
    }

    /* Added Multi-Select Styles */
    .multi-select {
      position: relative;
      display: inline-block;
    }

    .dropdown-panel {
      display: none;
      position: absolute;
      top: 42px;
      left: 0;
      width: 350px;
      max-height: 300px;
      overflow-y: auto;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px;
      z-index: 999;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .dropdown-panel label {
      display: block;
      margin-bottom: 8px;
      font-weight: normal;
    }

    .dropdown-panel input {
      margin-right: 8px;
    }

    /* Style for the selected channels display */
    #selectedChannelsList {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .channel-tag {
      background-color: #e0e7ff;
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
    }

    /* Style for multi-channel headers */
    .channel-section-header {
      border-bottom: 2px solid var(--border);
      padding-bottom: 10px;
      color: var(--primary);
      margin-top: 30px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div class="container">

<div style="display:flex; justify-content:flex-end; margin-bottom:16px; position:relative;">
  <button onclick="toggleUserMenu()" style="background:#111827;">
    👤 User ▾
  </button>

  <div id="userMenu" style="
      display:none;
      position:absolute;
      top:40px;
      right:0;
      background:white;
      border:1px solid #e5e7eb;
      border-radius:10px;
      box-shadow:0 10px 25px rgba(0,0,0,0.08);
      padding:10px;
      min-width:160px;
      z-index:100;
  ">
<div style="display:flex; flex-direction:column; gap:8px;">
  <div id="adminOption" style="display:none;">
    <button onclick="goToAdmin()" style="width:100%;">⚙️ Admin Panel</button>
  </div>

  <button onclick="goToTraffic()" style="width:100%;">
    📊 Traffic Dashboard
  </button>

  <button onclick="goToRca()" style="width:100%;">
    🔎 Impression RCA
  </button>

  <button onclick="logout()" style="width:100%; background:#ef4444;">
    🚪 Logout
  </button>
</div>
  </div>
</div>

  <div class="card">
    <h2>📤 Upload Promo</h2>

    <label>Channels</label><br>

    <div class="multi-select">
      <button
        type="button"
        id="channelDropdownBtn"
        class="secondary"
        onclick="toggleChannelDropdown()"
      >
        Select Channels ▼
      </button>

      <div id="channelDropdown" class="dropdown-panel"></div>
    </div>

    <!-- Container for selected channels -->
    <div id="selectedChannelsList"></div>

    <div id="platforms"></div>

    <br>
    <input type="file" id="fileInput" accept="video/mp4" multiple><br><br>

    <button onclick="uploadPromo()">Upload</button>
    <button class="secondary" onclick="cancelUpload()">Cancel</button>

    <br><br>
    <progress id="progressBar" max="100" value="0"></progress>
    <div id="status" class="status"></div>
  </div>

  <div class="card">
    <h2>📃 Existing Promos</h2>
    <button onclick="loadPromos()">Load Promos</button>
    <div id="promoList"></div>
  </div>

</div>

<script>

function goToAdmin() {
  window.location.href = "/admin.html";
}
function goToTraffic() {
  window.location.href = "/traffic.html";
}
function goToRca() {
  window.location.href = "/rca.html";
}

/* 🔐 AUTH CHECK handled by auth-guard.js loaded in <head> */

/* 🔐 AUTH FETCH (GLOBAL) — uses the shared authGuard helper */
function authFetch(url, options = {}) {
  options.headers = {
    ...(options.headers || {}),
    ...window.authGuard.authHeaders(),
  };
  return fetch(url, options);
}

function logout() { window.authGuard.logout(); }

function toggleUserMenu() {
  const menu = document.getElementById("userMenu");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
}

// Close dropdowns when clicking outside
document.addEventListener("click", function(e) {
  // User Profile Dropdown logic
  const menu = document.getElementById("userMenu");
  if (!e.target.closest("#userMenu") && !e.target.closest("button")) {
    menu.style.display = "none";
  }

  // Channels Dropdown logic
  const dropdown = document.querySelector(".multi-select");
  if (dropdown && !dropdown.contains(e.target)) {
    document.getElementById("channelDropdown").style.display = "none";
  }
});

// Show admin option only for admin role
if (localStorage.getItem("role") === "admin") {
  document.getElementById("adminOption").style.display = "block";
}

let currentXHR = null;

const channelDropdown = document.getElementById("channelDropdown");
const channelDropdownBtn = document.getElementById("channelDropdownBtn");
const platformsBox = document.getElementById("platforms");
const promoList = document.getElementById("promoList");
const statusEl = document.getElementById("status");
const progressBar = document.getElementById("progressBar");
const fileInput = document.getElementById("fileInput");

/* ---------- Channel Helper Functions ---------- */
function toggleChannelDropdown() {
  const dropdown = document.getElementById("channelDropdown");
  dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
}

function getSelectedChannels() {
  return [
    ...document.querySelectorAll("#channelDropdown input:checked")
  ].map(cb => cb.value);
}

function updateChannelButtonText() {
  const selected = getSelectedChannels();
  const listContainer = document.getElementById("selectedChannelsList");

  if (!selected.length) {
    channelDropdownBtn.textContent = "Select Channels ▼";
    listContainer.innerHTML = ""; // Clear the list if nothing is selected
    return;
  }

  channelDropdownBtn.textContent = `${selected.length} Channel(s) Selected ▼`;
  
  // Render the selected channels as HTML tags
  listContainer.innerHTML = selected
    .map(channel => `<span class="channel-tag">${channel}</span>`)
    .join('');
}

/* ---------- Load channels ---------- */
async function loadChannels() {
  const res = await authFetch("/channels");
  const channels = await res.json();

  channelDropdown.innerHTML = "";

  channels.forEach(channelName => {
    const label = document.createElement("label");
    label.innerHTML = `
      <input
        type="checkbox"
        value="${channelName}"
        onchange="
          updateChannelButtonText();
          loadPlatforms();
        "
      >
      ${channelName}
    `;
    channelDropdown.appendChild(label);
  });

  updateChannelButtonText();
}

/* ---------- Load platforms ---------- */
async function loadPlatforms() {
  platformsBox.innerHTML = "Loading platforms...";

  const selectedChannels = getSelectedChannels();

  if (!selectedChannels.length) {
    platformsBox.innerHTML = "";
    return;
  }

  /*
    Use first selected channel
    to determine available platforms
  */
  const channelName = selectedChannels[0];

  try {
    const res = await authFetch(`/channels/${encodeURIComponent(channelName)}`);

    if (!res.ok) {
      platformsBox.innerHTML = "❌ Failed to load platforms";
      return;
    }

    const platforms = await res.json();

    if (!platforms || platforms.length === 0) {
      platformsBox.innerHTML = "⚠️ No platforms available";
      return;
    }

    platformsBox.innerHTML = "";

    platforms.forEach(p => {
      const label = document.createElement("label");
      label.innerHTML = `
        <input type="checkbox" value="${p}" checked>
        ${p}
      `;
      platformsBox.appendChild(label);
    });

  } catch (err) {
    console.error(err);
    platformsBox.innerHTML = "❌ Platform load error";
  }
}

function getSelectedPlatforms() {
  return [...document.querySelectorAll("#platforms input:checked")]
    .map(i => i.value);
}

/* ---------- MULTI Upload ---------- */
async function uploadPromo() {
  const files = fileInput.files;
  const platforms = getSelectedPlatforms();

  if (
    !files.length ||
    !platforms.length ||
    !getSelectedChannels().length
  ) {
    alert("Select channel(s), file & platform(s)");
    return;
  }

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    statusEl.textContent = `Uploading ${file.name} to ${getSelectedChannels().length} channel(s)`;

    const fd = new FormData();
    fd.append("file", file);
    fd.append("channelNames", JSON.stringify(getSelectedChannels()));
    fd.append("platforms", JSON.stringify(platforms));

    await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      currentXHR = xhr;

      xhr.open("POST", "/upload");

      /* 🔐 ADD TOKEN */
      xhr.setRequestHeader(
        "Authorization",
        "Bearer " + localStorage.getItem("token")
      );

      xhr.upload.onprogress = e => {
        if (e.lengthComputable) {
          progressBar.value = (e.loaded / e.total) * 100;
        }
      };

      xhr.onload = () => {
        progressBar.value = 0;

        if (xhr.status === 401) {
          alert("Session expired. Login again.");
          logout();
          return;
        }

        resolve();
      };

      xhr.onerror = () => {
        statusEl.textContent = "❌ Upload failed";
        progressBar.value = 0;
        reject();
      };

      xhr.send(fd);
    });
  }

  currentXHR = null;
  statusEl.textContent = "✅ All uploads complete";
  fileInput.value = "";
  loadPromos();
}

function cancelUpload() {
  currentXHR?.abort();
  progressBar.value = 0;
  statusEl.textContent = "❌ Upload cancelled";
}

/* ---------- Load promos ---------- */
async function loadPromos() {
  promoList.innerHTML = "";

  const channels = getSelectedChannels();
  if (!channels.length) {
    promoList.innerHTML = "<p>Select at least one channel above</p>";
    return;
  }

  const platforms = getSelectedPlatforms();
  if (!platforms.length) {
    promoList.innerHTML = "<p>Select platform</p>";
    return;
  }

  // Iterate over every selected channel to fetch and render its promos
  for (const channel of channels) {
    
    // Create a container and header for this specific channel
    const channelContainer = document.createElement("div");
    channelContainer.style.marginBottom = "40px";
    channelContainer.innerHTML = `<h2 class="channel-section-header">📡 Channel: ${channel}</h2>`;
    
    const q = new URLSearchParams({
      channelName: channel,
      platforms: JSON.stringify(platforms)
    });

    const res = await authFetch(`/promos?${q}`);

    if (res.status === 401) {
      alert("Session expired. Login again.");
      logout();
      return;
    }

    if (!res.ok) {
      channelContainer.innerHTML += `<p style="color:red;">❌ Failed to load promos for ${channel}</p>`;
      promoList.appendChild(channelContainer);
      continue; // Skip to the next channel on error
    }

    const data = await res.json();
    const grid = document.createElement("div");
    grid.className = "platform-grid";

    Object.entries(data).forEach(([platform, urls]) => {
      const column = document.createElement("div");
      column.className = "platform-column";

      column.innerHTML = `
      <h3>📺 ${platform}</h3>

      <div style="margin-bottom:15px;">
        <label>
          <input
            type="checkbox"
            onclick="toggleSelectAll(this,'${channel}','${platform}')">
          Select All
        </label>

        <button
          style="margin-left:10px;background:#dc2626;"
          onclick="deleteSelectedPromos('${channel}', '${platform}')">
          🗑 Delete Selected
        </button>
      </div>
      `;

      if (!urls.length) {
        column.innerHTML += "<p>No promos</p>";
      } else {
        /* ---------- URL LIST ---------- */
        column.innerHTML += `
          <div style="
            background:white;
            border:1px solid #e5e7eb;
            border-radius:10px;
            padding:10px;
            margin-bottom:14px;
          ">
            <strong>Current Promo URLs</strong>
            <ul style="
              margin-top:8px;
              padding-left:18px;
              font-size:12px;
              word-break:break-all;
            ">
              ${urls.map(url => `
                <li>
                  <a href="${url}" target="_blank">${url}</a>
                </li>
              `).join("")}
            </ul>
          </div>
        `;

        /* ---------- Existing Video Cards ---------- */
        urls.forEach(url => {
          const filename = url.split("/").pop();

          column.innerHTML += `
            <div class="promo-card">
              <label style="display:block;margin-bottom:8px;">
              <input class="promoCheckbox" type="checkbox" data-channel="${channel}" data-platform="${platform}" value="${url}">Select</label>
              <strong>${filename}</strong>

              <video src="${url}" controls muted></video>

              <button onclick="deletePromo('${channel}', '${url}')">
                🗑 Delete
              </button>
            </div>
          `;
        });
      }

      grid.appendChild(column);
    });

    channelContainer.appendChild(grid);
    promoList.appendChild(channelContainer);
  }
}

/* ---------- Delete promo ---------- */
function toggleSelectAll(master, channel, platform) {
    // Select checkboxes specifically scoped to this channel AND platform
    document
        .querySelectorAll(
            `input.promoCheckbox[data-channel="${channel}"][data-platform="${platform}"]`
        )
        .forEach(cb => cb.checked = master.checked);
}

async function deleteSelectedPromos(channel, platform) {
    // Only grab checked URLs for this specific channel and platform
    const urls = [
        ...document.querySelectorAll(
            `input.promoCheckbox[data-channel="${channel}"][data-platform="${platform}"]:checked`
        )
    ].map(cb => cb.value);

    if (!urls.length) {
        alert("Select at least one promo in this section");
        return;
    }

    if (!confirm(`Delete ${urls.length} selected promo(s) for ${channel} on ${platform}?`))
        return;

    const res = await authFetch("/promos", {
        method: "DELETE",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            channelName: channel,
            platforms: [platform],
            urls
        })
    });

    if (res.ok) {
        loadPromos();
    } else {
        alert("Failed to delete promos");
    }
}

async function deletePromo(channel, url) {
  const filename = url.split("/").pop();
  const platformList = getSelectedPlatforms().join(", ");

  const confirmed = confirm(
    `Delete this promo?\n\nChannel: ${channel}\nFile: ${filename}\nPlatforms: ${platformList}`
  );

  if (!confirmed) return;

  const res = await authFetch("/promos", {
    method: "DELETE",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      channelName: channel,
      platforms: getSelectedPlatforms(),
      url
    })
  });

  if (res.status === 401) {
    alert("Session expired. Login again.");
    logout();
    return;
  }

  loadPromos();
}

loadChannels();
</script>

</body>
</html>
